<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>蛤（续版）</title>
<style>
body{background:#1b1d22;color:#ddd;font:15px/1.6 sans-serif;margin:20px}
canvas{background:#d9c9a3;display:block;margin:8px 0}
#log{white-space:pre-wrap;max-width:560px;color:#bbb}
</style></head><body>
<div>方向键走，空格原地等一步，也可以一直等到下一回潮。蛤肚子里有一只小蟹，就是你，身上拴着一根红线。出去叼虫，带回壳里。</div>
<canvas id="c" width="560" height="400"></canvas>
<div id="lg" style="font-size:13px;color:#999">地上画的：<span style="color:#3a5">■</span> 虫　<span style="color:#7c6">▪</span> 昨晚新下的小虫　<span style="color:#fff">○</span> 两只虫挨着，夜里会下小的　<span style="color:#c86a50">◯</span> 壳要是这会儿睡下，夜里吃掉的　<span style="color:#7fa6b8">⬭ →3</span> 往后两回潮会把壳冲到哪（箭头是潮的方向，数是还有几步来）</div>
<div id="st"></div>
<div id="log"></div>
<button id="spit">吐下嘴里的</button> <button id="wait">等到下一回潮</button> <button id="waitR">等往右的潮</button> <button id="waitL">等往左的潮</button> <button id="sleep">就在这儿睡下</button> <button id="again">过下一天</button> <button id="fresh" style="display:none">换一片岸，再来三天</button>
<script>
const FULL=-999;   // 续版七：拿掉续版六的不张嘴（开了含着等的近路）
let grown=0;   // 续版七：壳一共吃过几口，三天累计；每 8 口长大一圈，线放长一格（最多三圈）
const size=()=>grown<5?0:grown<12?1:grown<20?2:3;   // 续版八：第一圈 5 口，后面 12、20
let keepGrown=0,MIR=0;const mx=x=>MIR?W-1-x:x;   // 续版十五：三天一局，换一片岸＝左右换边
function roundEnd(){if(day%3!=2)return;let p=pairs(food).length;log.push('—— 三天过完了。沙上还留着 '+p+' 对虫，壳是第 '+(size()+1)+' 圈大。可以接着过下一天；也可以换一片岸再来三天（石头和虫换到另一边）。');document.getElementById('fresh').style.display=''}
   // 续版八：饿合上一回不清零，只缩一圈
const W=14,H=10,S=40,TIDE=4,DAY=90,MOUTH=12,GREY=22,SHUT=70;const STARVE=30;   // 续v23：饿合上的壳第二天醒来只剩 40 步，岸原样留着
const SHORE=H-3;
let rng; function R(n){rng=(rng*16807)%2147483647;return rng%n}
let prev=null,born=[],wake=null,splash=null,nest={},day=0,rocks,food,shell,path,carry,fed,step,hunger,log,over,seed=1;
const key=(x,y)=>x+','+y;
const mated=(f,arr)=>arr.some(q=>q!==f&&Math.abs(q.x-f.x)<=1&&Math.abs(q.y-f.y)<=1);   // 续版十一：挨着的（八邻）算一对
const DUSK=54;
function pairs(arr){let used=new Set(),out=[];let ord=arr.map((f,i)=>i).sort((a,b)=>arr[a].x-arr[b].x||arr[a].y-arr[b].y);ord.forEach((i,oi)=>{let f=arr[i];if(used.has(i))return;for(let oj=oi+1;oj<ord.length;oj++){let j=ord[oj];if(used.has(j))continue;let q=arr[j];if(Math.abs(q.x-f.x)<=1&&Math.abs(q.y-f.y)<=1){used.add(i);used.add(j);out.push([i,j]);return}}});return out}   // 续版十一：两只一对，一只只进一对   // 续版十一：下午起，落单的虫往最近的一只爬，凑对
function start(){window._lastIn=undefined;window._trail=null;
  // 搭版三：左头更稀（开局两只、新长的十只里一只），壳能撑 70 步——空手的路活得下来、吃得少。搭版：图是定的。左头是壳醒来的地方，虫稀；右头虫多，线够不着，得让潮把壳送过去
  rocks=new Set([[6,1],[6,2],[7,4],[3,2],[11,1],[12,3]].map(([x,y])=>key(mx(x),y)));
  rng=seed*7919+13+day*1013;
  nest={};carry=0;fed=0;grown=prev?(prev.grown||0):keepGrown;keepGrown=0;L=5+size();step=0;hunger=0;over=false;born=[];
  if(!prev){shell={x:mx(1),y:SHORE};food=[{x:2,y:4},{x:4,y:5}].map(f=>({x:mx(f.x),y:f.y}));for(let i=0;i<5;i++)addFood(true);
    log=['天亮了。壳浮到岸边张开了。']}
  else{ // 续版：壳昨晚停在哪，今天就在哪醒；虫留着，一夜每只下一只；壳夜里把身边两格内的吃了
    shell={x:prev.x,y:SHORE};food=prev.food.map(f=>({...f}));
    let near=prev.shut?[]:food.filter(f=>Math.abs(f.x-shell.x)<=2),ate=near.length;food=food.filter(f=>prev.shut||Math.abs(f.x-shell.x)>2);
    let old=food.map(f=>({...f}));let pr=pairs(old),pairedN=pr.length*2;pr.forEach(([i,j])=>{let f=old[i];if(food.length>=16)return;let n0=food.length;dropNear(f.x,f.y,1);if(food.length>n0)born.push(food[food.length-1])});
    let washed=0;if(food.length<2){let fx=shell.x<7?11:2;[[fx,3],[fx,4]].forEach(([x,y])=>{if(!rocks.has(key(x,y))&&!food.some(f=>f.x==x&&f.y==y)){food.push({x,y});washed++}})}   // 续版十三：沙上一只不剩（或剩一只），夜潮在远头冲上来一对——死图能重来，可还得自己护住这一对
    hunger=Math.max(0,prev.hunger-MOUTH*ate);
    log=[(prev.shut?'天亮了。壳昨天饿合上的地方，它还在那一格；夜里合着，一口没吃，只能撑 '+(SHUT-STARVE)+' 步。沙上的虫照你昨天留下的样子。':'天亮了。壳还在昨晚睡下的那一格。'+(ate?'它夜里把身边的 '+ate+' 只吃了。':'它身边一只虫也没有，饿着醒的。')),
         '昨天没吃完的 '+old.length+' 只里，挨着的 '+pairedN+' 只一夜下了 '+born.length+' 只小的'+(old.length-pairedN?'；落单的 '+(old.length-pairedN)+' 只没生。':'。')+(born.length<pr.length?'沙上挤满了，再多下不了。':'')+(washed?'夜潮在远处冲上来一对。':'')]}
  path=[{...shell}];wake=prev?{x:shell.x}:null;draw();
}
function crawl(){   // 续版十一：落单的往最近一只挪一格（不进石头、不进水、不叠）
  let snap=food.map(f=>({...f}));
  let inP=new Set();pairs(food).forEach(([i,j])=>{inP.add(food[i]);inP.add(food[j])});
  food.forEach(f=>{if(inP.has(f))return;let best=null,bd=4;food.forEach(q=>{if(q===f||inP.has(q))return;let d=Math.max(Math.abs(q.x-f.x),Math.abs(q.y-f.y));if(d<bd){bd=d;best=q}});
    if(!best)return;let nx=f.x+Math.sign(best.x-f.x),ny=f.y+Math.sign(best.y-f.y);
    if(rocks.has(key(nx,ny))||ny>=SHORE||food.some(q=>q.x==nx&&q.y==ny))return;let m=me();if(m.x==nx&&m.y==ny)return;f.x=nx;f.y=ny})}
function addFood(right){for(let t=0;t<60;t++){let x=mx((right||R(10))?9+R(5):R(5)),y=2+R(SHORE-2);
  if(!rocks.has(key(x,y))&&!food.some(f=>f.x==x&&f.y==y)){food.push({x,y});return}}}
function dropNear(x,y,n){for(let r=0;r<4&&n>0;r++)for(let dy=-r;dy<=r&&n>0;dy++)for(let dx=-r;dx<=r&&n>0;dx++){let a=x+dx,b=y+dy;
  if(a<0||b<0||a>=W||b>=SHORE||rocks.has(key(a,b))||food.some(f=>f.x==a&&f.y==b))continue;food.push({x:a,y:b});n--}}
const drift=h=>path.length==1?1:4;   // 第七版：你在壳里，壳沉，潮推它一格；你出去了，壳轻，一冲四格   // 吃饱的壳沉，潮推不动；饿空了的壳轻，一冲老远
const tideAt=s=>(MIR?-1:1)*(s%6==0?(Math.floor(s/6)%2<1?1:-1):0);   // 续版十七：潮序右右左左→右左右左，要的那头最多等 6 步   // 搭版二：潮 9 步→6 步，等得短
function slide(x,d,n){for(let k=0;k<n;k++){if(k>0&&nest[x]>0)break;let nx=x+d;if(nx<0||nx>=W)break;x=nx}return x}
const me=()=>path[path.length-1];
let L=5;
const nightExtra=()=>Math.round((DAY-step)*0.6);   // 续版四：睡得早，夜就长，壳多饿
// 两点之间的线有没有擦过石头
function clear(a,b){let n=Math.ceil(Math.hypot(b.x-a.x,b.y-a.y)*8);
  for(let i=1;i<n;i++){let x=a.x+(b.x-a.x)*i/n,y=a.y+(b.y-a.y)*i/n;
    for(let cx=Math.floor(x)-1;cx<=Math.ceil(x)+1;cx++)for(let cy=Math.floor(y)-1;cy<=Math.ceil(y)+1;cy++)
      if(rocks.has(key(cx,cy))&&Math.hypot(x-cx,y-cy)<0.45)return false}
  return true}
// 线绷紧：能直拉的就直拉，绕在石头边上的点留下
function taut(p){return [p[0],p[p.length-1]]}   // 第六版：线不再挂石头，只量你到壳的直线
function taut_old(p){let out=[p[0]],i=0;while(i<p.length-1){let j=p.length-1;while(j>i+1&&!clear(p[i],p[j]))j--;out.push(p[j]);i=j}return out}
const len=p=>{let t=0;for(let i=1;i<p.length;i++)t+=Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y);return t};
function move(dx,dy){
  if(over)return;
  let m=me(),nx=m.x+dx,ny=m.y+dy;
  if(nx<0||ny<0||nx>=W||ny>SHORE)return;   // 续版八补：不能走进水里（48 说红点在水面附近，认错位置）
  if(rocks.has(key(nx,ny))){log.push('石头挡住了。');tick();return}   // 续版二：撞石头也过一步，跟线绷直一样
  if(nx==shell.x&&ny==shell.y){path=[{...shell}]}
  else{let np=taut([...path,{x:nx,y:ny}]);
    if(len(np)>L){log.push('线绷直了，走不动。');tick();return}
    path=np}
  let n=me(),fi=food.findIndex(f=>f.x==n.x&&f.y==n.y);
  if(fi>=0&&carry<3){food.splice(fi,1);carry++;log.push('叼起一只（嘴里 '+carry+' 只）。')}
  else if(fi>=0&&carry>=3){log.push('嘴里满了，最多叼 3 只。这只留在地上。')}
  if(n.x==shell.x&&n.y==shell.y&&carry&&hunger<FULL){log.push('壳饱着，不张嘴。嘴里还叼着 '+carry+' 只。')}
  else if(n.x==shell.x&&n.y==shell.y&&carry){fed+=carry;{let b=size();grown+=carry;if(size()>b){L=5+size();window._grow='壳长大了一圈。线放长了，现在能走 '+L+' 格。'}}splash={x:shell.x,t:3};hunger=Math.max(0,hunger-MOUTH*carry);log.push('带回壳里了。壳吃了 '+carry+' 口。');carry=0}
  tick();
}
function tick(){
  step++;hunger++;
  if(step%6==0&&day==0)addFood();   // 续版十二：第二天起不再白长，虫只靠一对一对下
  if(step>=DUSK&&step%4==0)crawl();
  let d=tideAt(step);
  if(d){
    let moved=0,held=false,drag=0,sat=false;
    for(let k=0,dn=drift(hunger);k<dn;k++){
      if(k>0&&nest[shell.x]>0){sat=true;break}   // 窝版：漂到一个窝上，壳掉进去停住
      let nx=shell.x+d;if(nx<0||nx>=W)break;
      let ns={x:nx,y:shell.y};
      if(path.length==1){shell=ns;path=[{...ns}];moved++;continue}
      let np=taut([ns,...path.slice(1)]);
      if(len(np)<=L){shell=ns;path=np;moved++;let c=me();if(c.x==ns.x&&c.y==ns.y)path=[{...ns}];continue}
      if(np.length>2){held=true;break}   // 线挂在石头上：壳被拴住
      // 直线没挂住：你被往壳那边拖
      shell=ns;let c=me();
      while(len(np)>L){let p=np[np.length-2],c2=np[np.length-1];
        let sx=Math.sign(p.x-c2.x),sy=Math.sign(p.y-c2.y);
        let t={x:c2.x+sx,y:c2.y+sy};if(rocks.has(key(t.x,t.y)))t=rocks.has(key(c2.x+sx,c2.y))?{x:c2.x,y:c2.y+sy}:{x:c2.x+sx,y:c2.y};
        np=taut([...np.slice(0,-1),t]);drag++}
      path=np;moved++;
    }
    let w=d>0?'涨潮，往右':'退潮，往左';
    if(held)log.push(w+(moved?'，壳漂了 '+moved+' 格，停住了。':'。壳没动。'));
    else log.push(w+'，壳漂了 '+moved+' 格'+(sat?'，落进一个窝里停住了。':'。'));
    if(drag){log.push('线一绷，你被拖了 '+drag+' 格。');
      if(path.length==1||(me().x==shell.x&&me().y==shell.y)){path=[{...shell}]}
      if(carry){let m=me();dropNear(m.x,m.y,carry);log.push('一拖，嘴里的 '+carry+' 只掉了。');carry=0}}
  }
  {let m=me();if(path.length>1&&m.x==shell.x&&m.y==shell.y){path=[{...shell}]}
   if(path.length==1&&carry&&hunger<FULL){if(!window._fullSaid){log.push('壳饱着，不张嘴。嘴里还叼着 '+carry+' 只。');window._fullSaid=1}}
   else if(path.length==1&&carry){window._fullSaid=0;fed+=carry;{let b=size();grown+=carry;if(size()>b){L=5+size();window._grow='壳长大了一圈。线放长了，现在能走 '+L+' 格。'}}splash={x:shell.x,t:3};hunger=Math.max(0,hunger-MOUTH*carry);log.push('壳漂到你脚下，一口吞了 '+carry+' 只。');carry=0}}
  if(hunger>=SHUT){over=true;keepGrown=[0,0,5,12][size()];prev={x:shell.x,food:food.map(f=>({...f})),hunger:STARVE,grown:keepGrown,shut:1};if(size()){let g0=grown;grown=keepGrown;let nl=5+size();grown=g0;log.push('壳缩小了一圈，明天线只剩 '+nl+' 格。')}log.push('壳饿得合上了。今天它吃了 '+fed+' 口。明天它就在这一格醒，沙上的虫原样留着。');roundEnd()}
  else if(step>=DAY){over=true;prev={x:shell.x,food:food.map(f=>({...f})),hunger,grown};log.push('天黑了。今天它吃了 '+fed+' 口。');roundEnd()}
  if(window._grow){log.push(window._grow);window._grow=null}   // 续版八补：长大那句排在'吃了'后面
  draw();
}
let cv=typeof document!='undefined'&&document.getElementById('c'),g=cv&&cv.getContext('2d');
function draw(){
  if(!g)return;
  g.clearRect(0,0,cv.width,cv.height);
  for(let x=0;x<W;x++){g.fillStyle='#c4b48c';g.fillRect(x*S,SHORE*S,S,S);g.fillStyle='#7fa6b8';g.fillRect(x*S,(H-2)*S,S,S);g.fillStyle='#4d7488';g.fillRect(x*S,(H-1)*S,S,S)}
  rocks.forEach(k=>{let[x,y]=k.split(',').map(Number);g.fillStyle='#6b665c';g.beginPath();g.arc(x*S+20,y*S+20,17,0,7);g.fill()});
  for(let x in nest){let v=nest[x];if(v<=0)continue;g.fillStyle='rgba(90,65,40,'+Math.min(0.85,0.25+0.15*v)+')';g.beginPath();g.ellipse(+x*S+20,SHORE*S+24,Math.min(30,20+4*v),Math.min(13,7+2*v),0,0,7);g.fill()}
  if(false&&splash&&splash.t>0){g.fillStyle='rgba(120,90,55,'+(0.35*splash.t)+')';for(let i=0;i<7;i++){let a=Math.PI*(0.1+0.8*i/6),r=26+10*(3-splash.t);g.beginPath();g.arc(splash.x*S+20+Math.cos(a)*r*(i%2?1:-1),SHORE*S+24-Math.sin(a)*r*0.5,3,0,7);g.fill()}splash.t--}
  g.strokeStyle='rgba(40,110,60,0.55)';g.lineWidth=2;pairs(food).forEach(([i,j])=>{let f=food[i],q=food[j];let mx=(f.x+q.x)/2*S+20,my=(f.y+q.y)/2*S+20;g.fillStyle='#fff';g.strokeStyle='#253';g.lineWidth=1.5;g.beginPath();g.arc(mx,my,5,0,7);g.fill();g.stroke()});   // 续版十二：一对中间一个小白点，不连线（11 被读成一条长虫）
  food.forEach(f=>{let b=step<12&&born.some(q=>q.x==f.x&&q.y==f.y);g.fillStyle=b?'#7c6':'#3a5';b?g.fillRect(f.x*S+15,f.y*S+15,10,10):g.fillRect(f.x*S+13,f.y*S+13,14,14)});
  if(wake&&step<12){g.fillStyle='rgba(60,45,30,'+(0.5-step*0.04)+')';g.font='12px sans-serif';g.fillText('昨晚睡这儿',wake.x*S-8,SHORE*S-4);
    g.strokeStyle='rgba(60,45,30,'+(0.5-step*0.04)+')';g.setLineDash([3,3]);g.strokeRect((wake.x-2)*S,0,5*S,SHORE*S);g.setLineDash([])}
  if(!over&&step>=12){let a=Math.min(0.85,0.3+(step-12)*0.012);g.strokeStyle='rgba(150,60,40,'+a+')';g.setLineDash([5,4]);g.lineWidth=1.5;g.strokeRect((shell.x-2)*S+1,1,5*S-2,SHORE*S-2);g.setLineDash([]);
    g.fillStyle='rgba(150,60,40,'+a+')';g.font='bold 13px sans-serif';g.fillText('壳睡这儿，夜里吃掉圈着的',Math.max(2,(shell.x-2)*S+4),14);
    food.forEach(f=>{if(Math.abs(f.x-shell.x)<=2){g.strokeStyle='rgba(150,60,40,'+(a+0.2)+')';g.lineWidth=2;g.beginPath();g.arc(f.x*S+20,f.y*S+20,13,0,7);g.stroke()}})}   // 续版十四：下午起，壳此刻要是睡下、夜里会吃哪一条先画出来（64、65 到第二早才懂虚线框是夜食范围；拇指甲 4：变之前看得见）
  // 沙上的潮表：往后两回潮，壳没被拴住的话会漂到哪
  // 第十版：你迈出壳、回到壳那一步，圈从原来的地方划过去，沙上留一道痕（三步后淡掉）
  {let gs=[],x=shell.x;for(let s=step+1;s<=step+40&&gs.length<2;s++){let d=tideAt(s);if(d){x=slide(x,d,drift(0));gs.push(x)}}
   let inS=path.length==1;
   if(window._lastIn!==undefined&&window._lastIn!==inS&&window._lastGs){window._trail={from:window._lastGs.slice(),to:gs.slice(),ttl:3}}
   window._lastIn=inS;window._lastGs=gs;
   let t=null;if(t&&t.ttl>0){   // 窝版二：沙痕拿掉，免得跟窝混
for(let i=0;i<Math.min(t.from.length,t.to.length);i++){if(t.from[i]==t.to[i])continue;
      let y=shell.y*S+33,a=0.25*t.ttl;g.strokeStyle='rgba(110,90,60,'+a+')';g.lineWidth=3;g.setLineDash([5,4]);g.beginPath();g.moveTo(t.from[i]*S+20,y);g.lineTo(t.to[i]*S+20,y);g.stroke();g.setLineDash([]);
      g.fillStyle='rgba(110,90,60,'+a+')';g.beginPath();g.ellipse(t.from[i]*S+20,shell.y*S+20,13,8,0,0,7);g.fill()}
     t.ttl--}}
  {let x=shell.x,n=0;for(let s=step+1;s<=step+40&&n<2;s++){let d=tideAt(s);if(d){x=slide(x,d,drift(hunger+(s-step)));n++;
    g.strokeStyle='rgba(40,70,95,'+(n==1?0.8:0.4)+')';g.lineWidth=2;g.beginPath();g.ellipse(x*S+20,shell.y*S+20,15,10,0,0,7);g.stroke();
    g.fillStyle='rgba(40,70,95,'+(n==1?1:0.6)+')';g.font='12px sans-serif';g.fillText((d>0?'→':'←')+(s-step),x*S+10,shell.y*S+8)}}}
  g.lineWidth=3;g.strokeStyle=len(path)>L-1.5?'#ff2a1a':'#c8302a';g.beginPath();
  path.forEach((p,i)=>i?g.lineTo(p.x*S+20,p.y*S+20):g.moveTo(p.x*S+20,p.y*S+20));g.stroke();
  {// 壳口：越饿张得越小，快合上了就是一条缝
   let o=Math.max(0,1-hunger/SHUT),cx=shell.x*S+20,cy=shell.y*S+20+[0,30,18,8,0][drift(0)],gap=1+o*9;
   g.fillStyle='#efe9d6';g.beginPath();g.ellipse(cx,cy-gap/2,17+6*size(),7+2*size(),0,Math.PI,0);g.fill();
   g.beginPath();g.ellipse(cx,cy+gap/2,17+6*size(),7+2*size(),0,0,Math.PI);g.fill();
   g.fillStyle='#5a3a2a';g.fillRect(cx-14,cy-gap/2,28,gap);
   // 吃饱的壳沉，坐进浅水里，被水盖住一截
   g.fillStyle='rgba(127,166,184,0.8)';g.fillRect(shell.x*S-4,(H-2)*S,S+8,S);
   if(drift(hunger)<=2){g.strokeStyle='rgba(255,255,255,0.7)';g.lineWidth=1.5;g.beginPath();g.ellipse(cx,(H-2)*S+3,24+6*size(),4+size(),0,0,7);g.stroke()}}
  let m=me(),my=m.y*S+20+(path.length==1?[0,30,18,8,0][drift(0)]:0);g.fillStyle='#d33';g.beginPath();g.arc(m.x*S+20,my,path.length==1?5:8,0,7);g.fill();
  if(path.length>1&&food.some(f=>f.x==m.x&&f.y==m.y)){g.fillStyle='#3a5';g.fillRect(m.x*S+2,m.y*S+26,12,12);g.strokeStyle='#fff';g.lineWidth=2;g.strokeRect(m.x*S+2,m.y*S+26,12,12)}   // 续版十三：脚下有虫，露个角（61 漏看被红点盖住的掉虫）
  for(let i=0;i<carry;i++){g.fillStyle='#3a5';g.fillRect(m.x*S+28,m.y*S+5+i*10,8,8)}
  if(carry>=3){g.strokeStyle='#3a5';g.lineWidth=2;g.beginPath();g.arc(m.x*S+20,m.y*S+20,12,0,7);g.stroke()}
  document.getElementById('st').textContent=`第 ${day+1} 天　线 ${len(path).toFixed(1)}/${L}　壳吃了 ${fed} 口　壳还能撑 ${Math.max(0,SHUT-hunger)} 步　第 ${step}/${DAY} 步`;
  {let z=[];for(const t of log){let L=z[z.length-1];if(L&&L.t==t)L.n++;else z.push({t,n:1})}z=z.slice(-5);document.getElementById('log').innerHTML=z.map((o,i)=>'<div style="opacity:'+(i==z.length-1?1:0.45+0.1*i)+'">'+o.t.replace(/&/g,'&amp;').replace(/</g,'&lt;')+(o.n>1?' ×'+o.n:'')+'</div>').join('')}
  document.getElementById('again').style.visibility=over?'visible':'hidden';
  document.getElementById('wait').style.visibility=over?'hidden':'visible';
  document.getElementById('sleep').style.visibility=(!over&&path.length==1)?'visible':'hidden';
  {let ne=food.filter(f=>Math.abs(f.x-shell.x)<=2).length;let parts=[];if(nightExtra()>0)parts.push('夜长，壳多饿 '+nightExtra()+' 步');parts.push(ne?'壳夜里吃掉圈里 '+ne+' 只':'圈里没虫，壳饿着睡');document.getElementById('sleep').textContent='就在这儿睡下（'+parts.join('；')+'）'}   // 续版十五：代价挂在下决定的钮上（67 看见框不知道'谁吃、哪些'）
}
if(typeof document!='undefined'){
  addEventListener('keydown',e=>{if(e.key==' '){e.preventDefault();if(!over){log.push('你在原地等了一步。');tick()}return}const d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(d){e.preventDefault();move(...d)}});
  const waitDir=dir=>{if(over)return;let n=0;do{tick();n++}while(!over&&!(tideAt(step)*dir>0)&&n<30);log.push('（你等了 '+n+' 步。）');draw()};
  document.getElementById('waitR').onclick=()=>waitDir(1);document.getElementById('waitL').onclick=()=>waitDir(-1);

  document.getElementById('wait').onclick=()=>{if(over)return;let n=0;do{tick();n++}while(!over&&!tideAt(step)&&n<20);log.push('（你等了 '+n+' 步。）');draw()};
  document.getElementById('sleep').onclick=()=>{if(over||path.length!=1)return;over=true;let ex=nightExtra();prev={x:shell.x,food:food.map(f=>({...f})),hunger:Math.min(SHUT-5,hunger+ex),grown};log.push('你缩进壳里，壳合上睡了。今天它吃了 '+fed+' 口。'+(ex?'天还亮着，这一夜长，它要多饿 '+ex+' 步。':'')+(hunger+ex>SHUT-5?'它饿得快合不上了，夜里硬撑着，明早只剩 5 步（圈里有虫的话，它夜里吃了能缓过来些）。':''));roundEnd();draw()};
  document.getElementById('spit').onclick=()=>{if(over||!carry)return;let m=me();let n0=food.length;dropNear(m.x,m.y,carry);log.push('你把嘴里的 '+carry+' 只吐在这儿。');carry=0;tick()};
  document.getElementById('again').onclick=()=>{if(!over)prev={x:shell.x,food:food.map(f=>({...f})),hunger,grown};day++;start()}   // 窝版二：窝过夜不变浅;
  document.getElementById('fresh').onclick=()=>{MIR^=1;seed++;day=0;prev=null;keepGrown=0;grown=0;document.getElementById('fresh').style.display='none';start()};
  {let q=new URLSearchParams(location.search);if(q.get('seed'))seed=+q.get('seed')}
  start();
}
</script></body></html>
